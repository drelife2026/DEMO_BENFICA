<title>Drelife · Demo Second Life · SL Benfica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap">
<style>
/* Layout: a presenter shell (bar + stage + controls) around a device frame that renders the club's own site */
:root{
  --bg:#F4F4F5; --bg2:#ECECEE; --panel:#FFFFFF; --ink:#111113; --muted:#8A8A91; --faint:#B4B4BA; --line:rgba(17,17,19,.10); --hi:#111113; --chip:#F2F2F4; --logo:none; --chipbg:rgba(17,17,19,.07); --trk:rgba(17,17,19,.10);
  --f-shell:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-club:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1A1A1C;--bg2:#0E0E10;--panel:#1F1F22;--ink:#EDEDEF;--muted:#8E8E95;--faint:#5A5A60;--line:rgba(255,255,255,.10);--hi:#EDEDEF;--chip:#2A2A2E;--logo:invert(1);--chipbg:rgba(255,255,255,.08);--trk:rgba(255,255,255,.12);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1A1A1C;--bg2:#0E0E10;--panel:#1F1F22;--ink:#EDEDEF;--muted:#8E8E95;--faint:#5A5A60;--line:rgba(255,255,255,.10);--hi:#EDEDEF;--chip:#2A2A2E;--logo:invert(1);--chipbg:rgba(255,255,255,.08);--trk:rgba(255,255,255,.12);color-scheme:dark}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--f-shell);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
*{box-sizing:border-box}
[hidden]{display:none!important}
.chkl{display:flex!important;align-items:center;gap:8px;font-weight:500;cursor:pointer}.chkl input{width:16px;height:16px;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hi);outline-offset:3px;border-radius:4px}
.shell{height:100%;display:flex;flex-direction:column;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
/* top */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:22px;width:auto;display:block;filter:var(--logo)}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--chipbg);border-radius:999px;padding:4px 10px}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.icons{display:flex;gap:2px}
.ib{width:34px;height:34px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center;color:var(--ink)}
.ib svg{width:19px;height:19px}
.ib:hover{background:var(--chipbg)}
.pickwrap{position:relative;display:inline-flex;align-items:center;gap:6px;min-width:0}
.clubpick{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-size:15px;font-weight:500;padding:0 22px 0 0;margin-right:-22px;height:34px;cursor:pointer;max-width:280px;text-overflow:ellipsis}
.pickwrap svg{pointer-events:none;color:var(--ink);width:14px;height:14px}
.seg{display:inline-flex;gap:4px}
.seg button{width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:grid;place-items:center}
.seg button svg{width:19px;height:19px}
.seg button[aria-pressed="true"]{background:var(--chipbg);color:var(--ink)}
.vr{width:1px;height:24px;background:var(--line)}
.perso{border:0;background:transparent;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink);height:36px;padding:0 4px}
.perso svg{width:18px;height:18px}
.btnS{height:38px;padding:0 18px;border-radius:999px;border:0;background:transparent;font-size:14px;font-weight:500;color:var(--ink)}
.btnS.pri{background:var(--ink);color:var(--panel)}
.btnS.ln{box-shadow:inset 0 0 0 1px var(--line)}
.btnS:disabled{opacity:.3;cursor:default}
/* sections as progress segments */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-block:12px 4px}
.steps .gt{border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:var(--muted);min-width:0}
.steps .gt .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .gt .tr{height:3px;border-radius:999px;background:var(--trk);overflow:hidden;display:block}
.steps .gt .tr i{display:block;height:100%;width:0;background:var(--ink);border-radius:999px;transition:width .25s}
.steps .gt:hover{color:var(--ink)}
.steps .gt.on{color:var(--ink);font-weight:500}
.steps .gt.done .tr i{width:100%;opacity:.28}
/* stage */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-block:40px 20px;overflow:hidden}
.device{position:relative;flex-shrink:0;transform-origin:center center}
.device.desktop{width:1280px;height:800px;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.08)}
.chrome{height:44px;background:#F6F6F7;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid #E5E5E8}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.lights i:nth-child(1){background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.navb{display:flex;gap:10px;color:#A1A1A8;width:60px}
.chrome .url{flex:1;max-width:520px;margin:0 auto;height:28px;border-radius:8px;background:#EBEBED;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font:12.5px var(--f-shell);color:#55555C}
.chrome .url svg{color:#8A8A91}
.sbar{display:none}
.device.desktop .viewport{height:756px}
.device.mobile{width:390px;height:800px;border-radius:54px;padding:11px;background:#0B0B0C;box-shadow:0 0 0 1.5px #3A3A3E inset,0 24px 60px rgba(0,0,0,.22)}
.device.mobile .chrome{display:none}
.device.mobile .sbar{display:flex;position:absolute;top:11px;left:11px;right:11px;height:50px;align-items:center;justify-content:space-between;padding:0 30px 0 34px;background:#fff;border-radius:43px 43px 0 0;z-index:2;font:600 15px var(--f-shell);color:#111}
.sbar .island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:108px;height:31px;border-radius:20px;background:#0B0B0C}
.sbar .sic{display:flex;gap:6px;align-items:center}
.device.mobile .viewport{height:728px;border-radius:0 0 43px 43px;margin-top:50px}
.viewport{overflow-y:auto;overflow-x:hidden;background:#fff;scrollbar-width:none}
.viewport::-webkit-scrollbar{display:none}
.foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:4px 20px;font-size:14px}
.foot #next{justify-self:end}
.foot #prev{justify-self:start}
.foot .t{color:var(--muted);text-align:center;min-width:0;white-space:nowrap}
.foot .t b{color:var(--ink);font-weight:500}
.kbd{display:inline-flex;gap:4px;margin-left:14px;vertical-align:1px}
.kbd span{min-width:20px;height:20px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--line);display:inline-grid;place-items:center;font-size:11px;color:var(--muted)}
@media (max-width:700px){.kbd{display:none}}
.note{font-size:13px;color:var(--faint)}

/* view modes */
.seg.vm button{width:auto;padding:0 10px;gap:6px;display:inline-flex;align-items:center;font-size:13px}
.seg.vm button span{display:inline}
.perso{gap:8px}
.top{padding-block:12px 10px}
.steps{padding-block:8px 2px}
.foot{padding-block:2px 12px}
.stage{padding-block:16px 8px}
body.zoom .stage{overflow:auto;align-items:flex-start}
body.pres .top,body.pres .steps,body.pres .foot{display:none}
body.pres .stage{padding:0}
body.pres .shell{padding-left:0;padding-right:0}
.presbar{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:none;gap:6px;z-index:15;opacity:.25;transition:opacity .2s}
.presbar:hover,.presbar:focus-within{opacity:1}
body.pres .presbar{display:flex}
.presbar button{height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--ink);color:var(--panel);font-size:13px}
@media (max-width:900px){.seg.vm button span{display:none}}
/* settings drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);z-index:20;display:flex;flex-direction:column;box-shadow:-30px 0 80px rgba(0,0,0,.14);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:22px 24px 14px}
.dh h2{margin:0;font-size:20px;font-weight:500;letter-spacing:-.01em}
.db{flex:1;overflow-y:auto;padding:6px 24px 18px;display:flex;flex-direction:column;gap:18px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px}
.fld label{color:var(--muted)}
.fld input[type=text],.fld input[type=number]{height:42px;border:0;border-radius:12px;padding:0 12px;background:var(--chip);font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.colr{display:flex;align-items:center;gap:8px}
.colr input[type=color]{width:42px;height:42px;border:0;border-radius:12px;padding:4px;background:var(--chip)}
.colr input[type=text]{flex:1;min-width:0}
.crestbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crestbox .cv{width:56px;height:56px;border-radius:14px;background:var(--chip);display:grid;place-items:center;overflow:hidden}
.crestbox .cv img,.crestbox .cv svg{width:44px;height:44px;object-fit:contain}
.prodrow{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center}
.prodrow .pv{width:48px;height:48px;border-radius:10px;background:var(--chip);overflow:hidden;display:grid;place-items:center}
.prodrow .pv img,.prodrow .pv svg{width:100%;height:100%;object-fit:cover}
.prodrow input{height:40px;border:0;border-radius:10px;padding:0 10px;background:var(--chip);min-width:0}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;font-size:13px;box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.df{padding:16px 24px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line)}
.msg{font-size:12.5px;color:var(--muted);flex-basis:100%}
.selx{height:42px;border:0;border-radius:12px;padding:0 10px;background:var(--chip);font-size:14px}
.cv.cover{width:84px}
.cv.cover img{width:100%!important;height:100%!important;object-fit:cover!important}
.dfx{display:flex;gap:8px;flex-basis:100%;margin-top:4px}
.hsec{font-size:13px;color:var(--muted);margin-top:6px}
@media (max-width:700px){.brand small{display:none}.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* ================= CLUB SITE (mock, uses the club's own colors) ================= */
.club{--c1:#0B2A5B;--c2:#C8102E;--on1:#fff;--on2:#fff;--ink:#14161B;--mut:#666B76;--ln:#E7E8EC;--soft:#F5F6F8;
  container-type:inline-size;font-family:var(--f-club);color:var(--ink);background:#fff;min-height:100%;display:flex;flex-direction:column;font-size:15px}
.club a{color:inherit;text-decoration:none}
.club .disp{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.c-top{display:flex;align-items:center;gap:22px;padding:12px 40px;border-bottom:1px solid var(--ln);background:#fff;position:sticky;top:0;z-index:3}
.c-top .crest{width:40px;height:40px;flex-shrink:0}
.c-top .crest img,.c-top .crest svg{width:100%;height:100%;object-fit:contain}
.c-top .cn{font-family:var(--f-disp);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.c-top nav{display:flex;gap:20px;margin-left:auto;font-size:14px;color:var(--mut)}
.c-top nav .on{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--c2);padding-bottom:4px}
.c-top .ic{display:none;margin-left:auto}
.c-steps{height:3px;background:var(--ln)}
.c-steps i{display:block;height:100%;background:var(--c2)}
.c-main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:40px 40px 56px;display:grid;grid-template-columns:1fr 300px;gap:56px;align-items:start}
.c-main.one{grid-template-columns:1fr;max-width:760px}
.back{font-size:13px;color:var(--mut);display:inline-block;margin-bottom:14px}
.club h1{margin:0;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.club .sub{color:var(--mut);margin:8px 0 0;line-height:1.5}
.club .cont{margin-top:26px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pc{border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:#fff;text-align:left;padding:0;display:block;width:100%;transition:border-color .15s,box-shadow .15s}
.pc:hover{border-color:var(--c1)}
.pc.sel{border-color:var(--c1);box-shadow:0 0 0 1px var(--c1)}
.pc .ph{aspect-ratio:1/1;background:var(--soft);display:grid;place-items:center;overflow:hidden;position:relative}
.pc .ph img.seal{position:absolute;top:8px;left:8px;width:15%!important;min-width:30px;max-width:46px;height:auto!important;object-fit:contain}
.pc .ph img{width:100%;height:100%;object-fit:cover}
.pc .ph svg{width:72%;height:72%}
.pc .nm{padding:10px 12px;font-size:14px;font-weight:600;line-height:1.3}
.pc .nm small{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}
.opt{border:1px solid var(--ln);border-radius:12px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;width:100%;text-align:left}
.opt.sel{border-color:var(--c1);box-shadow:0 0 0 1px var(--c1)}
.opt b{display:block;font-size:15px}
.opt span{display:block;color:var(--mut);font-size:13px;margin-top:3px}
.opt .rd{width:20px;height:20px;border-radius:50%;border:1.5px solid #C9CCD3;flex-shrink:0}
.opt.sel .rd{border:6px solid var(--c1)}
.fl{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600}
.in{border:1px solid var(--ln);border-radius:10px;padding:12px 14px;font-size:14px;font-weight:400;color:var(--ink);background:#fff;min-height:46px}
.in.ta{min-height:96px;line-height:1.5}
.fg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.fg .full{grid-column:1/-1}
.drop{border:1.5px dashed #CBCED6;border-radius:12px;padding:22px;text-align:center;color:var(--mut);font-size:13px;background:var(--soft)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.slot{aspect-ratio:1/1;border-radius:10px;background:var(--soft);overflow:hidden;position:relative;display:grid;place-items:center}
.slot svg{width:70%;height:70%}
.slot img{width:100%;height:100%;object-fit:cover}
.slot em{position:absolute;left:6px;bottom:6px;font-style:normal;font-size:11px;background:#fff;border-radius:6px;padding:2px 6px;color:var(--ink)}
.slot .ok{position:absolute;right:6px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--c1);color:var(--on1);font-size:11px;display:grid;place-items:center}
.codes{display:flex;gap:8px}
.codes span{width:46px;height:54px;border:1px solid var(--ln);border-radius:10px;display:grid;place-items:center;font-size:20px;font-weight:600}
.act{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--ln);flex-wrap:wrap}
.act .q{font-size:13px;color:var(--mut)}
.cb{height:48px;padding:0 26px;border-radius:999px;font-weight:700;font-size:14.5px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.cb.p{background:var(--c1);color:var(--on1)}
.cb.s{background:var(--c2);color:var(--on2)}
.cb.o{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.info{border-radius:12px;padding:14px 16px;background:color-mix(in srgb,var(--c1) 8%,#fff);border:1px solid color-mix(in srgb,var(--c1) 18%,#fff);font-size:13.5px;line-height:1.55}
.info b{display:block;margin-bottom:4px;color:var(--c1)}
.itm{border:1px solid var(--ln);border-radius:12px;padding:14px;display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center}
.itm .th{width:64px;height:64px;border-radius:10px;background:var(--soft);overflow:hidden;display:grid;place-items:center}
.itm .th svg{width:80%;height:80%}
.itm .th img{width:100%;height:100%;object-fit:cover}
.itm b{font-size:15px}
.itm small{display:block;color:var(--mut);margin-top:3px;font-size:12.5px}
.price{font-family:var(--f-disp);font-size:28px;font-weight:700}
/* sidebar */
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:90px}
.box{border:1px solid var(--ln);border-radius:14px;padding:18px;background:var(--soft)}
.box h3{margin:0 0 12px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.sl{list-style:none;margin:0;padding:0}
.sl li{display:flex;align-items:center;gap:10px;font-size:14px;color:#A0A4AE;padding:6px 0}
.sl li i{width:22px;height:22px;border-radius:50%;border:1.5px solid #D3D6DC;display:grid;place-items:center;font-style:normal;font-size:11px;flex-shrink:0}
.sl li.d{color:var(--ink)} .sl li.d i{background:var(--c1);border-color:var(--c1);color:var(--on1)}
.sl li.c{color:var(--ink);font-weight:700} .sl li.c i{border-color:var(--c1);color:var(--c1)}
.mini{display:flex;gap:10px;align-items:center}
.mini .th{width:48px;height:48px;border-radius:8px;background:#fff;overflow:hidden;display:grid;place-items:center;flex-shrink:0}
.mini .th svg{width:80%;height:80%} .mini .th img{width:100%;height:100%;object-fit:cover}
.mini b{font-size:14px} .mini small{display:block;color:var(--mut);font-size:12.5px}
.pw{font-size:11.5px;color:var(--mut);text-align:center;padding:16px;border-top:1px solid var(--ln)}
/* landing */
.hero{background:var(--c1);color:var(--on1);position:relative;overflow:hidden}
.hero .in2{max-width:1040px;margin:0 auto;padding:56px 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
.hero .eb{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.hero h1{font-family:var(--f-disp);font-size:76px;line-height:.9;text-transform:uppercase;color:var(--on1);margin:14px 0 0;letter-spacing:0}
.hero p{font-size:17px;line-height:1.5;opacity:.88;max-width:440px;margin:18px 0 0}
.hero .ctas{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.hero .ghost{background:transparent;color:var(--on1);border:1.5px solid color-mix(in srgb,var(--on1) 50%,transparent)}
.hero .art{position:relative;height:340px}
.hero .art svg{position:absolute;width:250px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.35))}
.hero .stripe{position:absolute;right:-60px;top:0;bottom:0;width:260px;background:var(--c2);transform:skewX(-12deg);opacity:.9}
.sec{max-width:1040px;margin:0 auto;padding:48px 40px;width:100%}
.sec h2{font-family:var(--f-disp);font-size:40px;text-transform:uppercase;margin:0}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}
.how div{border-top:3px solid var(--c2);padding-top:14px}
.how b{font-family:var(--f-disp);font-size:24px;text-transform:uppercase;display:block}
.how p{color:var(--mut);margin:6px 0 0;line-height:1.5;font-size:14px}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
.shop .pc .nm .pr{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--c1);background:color-mix(in srgb,var(--c1) 10%,#fff);border-radius:999px;padding:3px 8px}
.cfoot{background:#0F1115;color:#C9CCD3;font-size:13px;padding:22px 40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* success + voucher */
.okc{width:84px;height:84px;border-radius:50%;background:color-mix(in srgb,var(--c1) 10%,#fff);display:grid;place-items:center;margin:0 auto 16px;color:var(--c1)}
.center{text-align:center}
.vch{border-radius:18px;background:var(--c1);color:var(--on1);padding:24px;position:relative;overflow:hidden;max-width:420px}
.vch:after{content:"";position:absolute;right:-40px;top:-30px;width:180px;height:260px;background:var(--c2);transform:skewX(-14deg);opacity:.85}
.vch>*{position:relative;z-index:1}
.vch .amt{font-family:var(--f-disp);font-size:64px;font-weight:800;line-height:1;margin-top:16px}
.vch .code{display:inline-block;margin-top:16px;background:#fff;color:#111;font-weight:700;letter-spacing:.12em;border-radius:8px;padding:8px 12px;font-size:14px}
.vch .vt{display:flex;align-items:center;gap:10px;font-weight:700}
.vch .vt .crest{width:34px;height:34px}
.vch .vt .crest img,.vch .vt .crest svg{width:100%;height:100%;object-fit:contain}
/* dashboard */
.dash{display:grid;grid-template-columns:240px 1fr;height:100%;min-height:100%;font-size:13.5px;background:#F6F7F9}
.dnav{background:#fff;border-right:1px solid var(--ln);padding:16px 12px;display:flex;flex-direction:column;gap:2px;font-family:"Inter",var(--f-club);height:762px;overflow-y:auto;scrollbar-width:none;position:sticky;top:0}
.dnav::-webkit-scrollbar{display:none}
.dl{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 14px;border-bottom:1px solid #E7E7EA;margin-bottom:12px}
.dl img{height:21px;width:auto}
.dl .col{font-size:16px;color:#111;padding-right:6px}
.me{display:flex;align-items:center;gap:10px;padding:2px 2px 12px}
.av{position:relative;width:38px;height:38px;border-radius:50%;background:#fff;overflow:visible;box-shadow:0 0 0 2.5px #F0B92E;display:grid;place-items:center;font-weight:700;color:#1F4D45;font-size:17px;flex-shrink:0;margin-bottom:8px}
.av img,.av svg{width:68%;height:68%;object-fit:contain}
.av em{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-style:normal;font-size:8.5px;font-weight:600;background:#F0B92E;color:#fff;border-radius:6px;padding:1px 5px}
.me b{display:block;font-size:12px;font-weight:500;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.me small{display:block;font-size:11px;color:#6B6F78;margin-top:2px}
.dnav .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#1B1D22;font-size:12.5px;cursor:default}
.dnav .it svg{flex-shrink:0;width:16px;height:16px}
.dnav .it .chev{margin-left:auto;font-style:normal;font-size:13px;line-height:1;color:#1B1D22;transition:transform .15s}
.dnav .it .chev.open{transform:rotate(90deg)}
.dnav .it[data-cfg]{cursor:pointer}
.dnav .it.sv{border:1px solid #74C26E;background:#E6F4E3;color:#47A142;margin:6px 0}
.dnav .it.sv .chev{color:#47A142}
.dnav .it.on{background:#E6E7EA}
.dnav .sub{padding-left:14px}
.dnav .bot{margin-top:auto;padding-top:10px;border-top:1px solid #E7E7EA}
.dmain{padding:22px 26px;display:flex;flex-direction:column;gap:16px;min-width:0}
.dh2{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dh2 h1{font-size:24px}
.ex{font-size:11.5px;color:var(--mut);background:#fff;border:1px dashed #CBCED6;border-radius:999px;padding:3px 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px 16px}
.kpi span{color:var(--mut);font-size:12.5px}
.kpi b{display:block;font-family:var(--f-disp);font-size:34px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:#1E8E4E;font-weight:600}
.dgrid{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.st.w{background:#E2F5F3;color:#0F766E}.st.a{background:#EEF0FF;color:#4338CA}.st.x{background:#F3F4F6;color:#6B7280}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dtop b{font-size:15px}
.stp{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.stp li{display:flex;flex-direction:column;align-items:flex-start;gap:5px;font-size:11px;color:#9AA0AA;border-top:2px solid #E5E7EB;padding-top:7px}
.stp li i{display:none}
.stp li.d{color:var(--ink);border-color:var(--c1)}
.stp li.c{color:var(--c1);font-weight:700;border-color:var(--c1)}
.stp li.x{color:#B42318;border-color:#B42318;font-weight:700}
.pfield{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mut)}
.pin{display:flex;align-items:center;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:#fff}
.pin input{flex:1;min-width:0;border:0;padding:9px 12px;font:600 16px var(--f-club);color:var(--ink);outline:none}
.pin em{font-style:normal;padding:0 12px;color:var(--mut)}
.pin:focus-within{border-color:var(--c1)}
.pfield select{border:1px solid var(--ln);border-radius:8px;padding:9px 10px;font:14px var(--f-club);background:#fff;color:var(--ink)}
.cb.w{width:100%;height:42px;font-size:14px}
.cb.danger{background:#B42318;color:#fff}
.cb.dash{border-style:dashed}
.cb:disabled{opacity:.35;cursor:not-allowed}
.hint{margin:0;font-size:12px;color:var(--mut);line-height:1.45}
.note2{font-size:13px;line-height:1.45;color:var(--ink);background:var(--soft);border-radius:8px;padding:10px 12px}
.label{border:1px dashed #B9BDC6;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.label .lt{display:flex;justify-content:space-between;font-size:13px}
.label .lt span{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mut)}
.bc{display:flex;gap:2px;height:38px;align-items:stretch}
.bc i{background:#111;display:block}
.label .lr{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.chk{display:flex;flex-direction:column;gap:2px}
.chk label{display:flex;gap:10px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--c1)}
.kv.tot{padding-top:8px;border-top:1px solid var(--ln)} .kv.tot b{font-size:16px}
.vmini{background:var(--c1);color:var(--on1);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.vmini span{font-size:12px;opacity:.85}.vmini b{font:800 32px var(--f-disp)}.vmini code{font-size:12px;background:#fff;color:#111;border-radius:6px;padding:3px 8px;align-self:flex-start;letter-spacing:.08em}
.tbl tr{cursor:pointer}

.tbl{background:#fff;border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.tbl table{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:left;padding:10px 14px;background:var(--soft);font-weight:600}
.tbl td{padding:10px 14px;border-top:1px solid var(--ln);vertical-align:middle;font-variant-numeric:tabular-nums}
.tbl tr.on td{background:color-mix(in srgb,var(--c1) 6%,#fff)}
.tbl .pm{display:flex;align-items:center;gap:10px}
.tbl .pm .th{width:34px;height:34px;border-radius:6px;background:var(--soft);overflow:hidden;display:grid;place-items:center;flex-shrink:0}
.tbl .pm .th svg{width:80%;height:80%} .tbl .pm .th img{width:100%;height:100%;object-fit:cover}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.st:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.p{background:#FFF4DB;color:#9A6200}.st.t{background:#E7F0FF;color:#1D5BD6}.st.e{background:#F1EAFE;color:#6B3FD0}.st.v{background:#E3F6EA;color:#18794A}
.det{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.det .ph4{display:grid;grid-template-columns:repeat(4,52px);gap:6px}
.det .ph4 div{aspect-ratio:1;border-radius:6px;background:var(--soft);overflow:hidden;display:grid;place-items:center}
.det .ph4 svg{width:80%;height:80%} .det .ph4 img{width:100%;height:100%;object-fit:cover}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)} .kv b{color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:5px;height:70px}
.bars i{flex:1;background:color-mix(in srgb,var(--c1) 25%,#fff);border-radius:3px 3px 0 0}
.bars i:last-child{background:var(--c1)}

/* ---- narrow (phone) layout of the club site via container queries ---- */
@container (max-width:640px){
  .c-top{padding:12px 16px;gap:10px}
  .c-top nav{display:none}
  .c-top .ic{display:block}
  .c-top .cn{font-size:17px}
  .c-main{grid-template-columns:1fr;padding:22px 16px 28px;gap:20px}
  .side{display:none}
  .club h1{font-size:22px}
  .g3,.shop{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .fg{grid-template-columns:1fr}
  .slots{grid-template-columns:repeat(4,1fr);gap:6px}
  .codes span{width:40px;height:48px}
  .act{flex-direction:column-reverse;align-items:stretch}
  .act .cb{width:100%}
  .hero .in2{grid-template-columns:1fr;padding:30px 16px 24px}
  .hero h1{font-size:50px}
  .hero .art{height:200px}
  .hero .art svg{width:150px}
  .hero .stripe{width:120px}
  .sec{padding:30px 16px}
  .sec h2{font-size:30px}
  .how{grid-template-columns:1fr;gap:14px}
  .cfoot{padding:18px 16px}
  .itm{grid-template-columns:56px 1fr}
  .itm .price{grid-column:2}
}

/* landing · cover */
.hero.cov{background:linear-gradient(90deg,var(--c1) 0%,color-mix(in srgb,var(--c1) 80%,transparent) 42%,transparent 80%),var(--cov) center/cover no-repeat,var(--c1);min-height:460px}
.hero.cov .art{visibility:hidden}
/* landing · cómo funciona */
.how div{border-top:1px solid var(--ink)}
.how b{font-family:var(--f-club);text-transform:none;font-size:17px;font-weight:600}

.slabel{border:1.5px dashed #9EA3AD;border-radius:10px;padding:18px;max-width:520px;display:flex;flex-direction:column;gap:14px;background:#fff}
.sl-h{display:flex;align-items:center;gap:12px}
.sl-h .crest{width:34px;height:34px}.sl-h .crest img,.sl-h .crest svg{width:100%;height:100%;object-fit:contain}
.sl-h b{display:block;font-size:14px}.sl-h small{color:var(--mut);font-size:12px}
.sl-c{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;letter-spacing:.04em}
.sl-b{display:flex;gap:2px;height:64px;justify-content:center}.sl-b i{background:#111;display:block}
.sl-g{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;border-top:1px solid var(--ln);padding-top:12px}
.sl-g small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.sl-g b{display:block;font-size:14px;margin-top:2px}.sl-g span{font-size:12.5px;color:var(--mut)}
.tline{list-style:none;margin:0;padding:0;max-width:460px}
.tline li{display:flex;gap:14px;position:relative;padding-bottom:20px}
.tline li:before{content:"";position:absolute;left:9px;top:20px;bottom:0;width:2px;background:var(--c1)}
.tline li:last-child:before{display:none}
.tline li i{width:20px;height:20px;border-radius:50%;background:var(--c1);flex-shrink:0;box-shadow:inset 0 0 0 5px var(--c1),inset 0 0 0 7px #fff}
.tline li.c i{background:#fff;box-shadow:inset 0 0 0 2px var(--c1)}
.tline b{display:block;font-size:15px}.tline small{color:var(--mut);font-size:13px}
@container (max-width:640px){.sl-g{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Benfica: segundo color blanco */
.club .cb.s{background:var(--c1);color:var(--on1)}
.club .hero .cb.s{background:#fff;color:var(--c1)}
.club .c-top nav .on{box-shadow:inset 0 -2px 0 var(--c1)}
.club .c-steps i{background:var(--c1)}
.club .hero .stripe{opacity:.12}
.club .vch:after{opacity:.14}
.club .how div{border-top-color:var(--c1)}
</style>

function drawProds(){$('prodList').innerHTML=editing.products.map(function(p,i){return '<div class="prodrow"><div class="pv">'+(p.photo?img(src(p.photo)):garment(p.kind,editing))+'</div><input type="text" id="pn'+i+'" value="'+esc(p.name)+'" aria-label="Product name '+(i+1)+'">'+
  '<label class="filebtn">'+(p.photo?'Change photo':'Subir foto')+'<input type="file" accept="image/*" data-pf="'+i+'"></label></div>';}).join('');}
function live(){var e=editing;e.name=$('fName').value||'Club';e.short=$('fShort').value||e.name;e.season=$('fSeason').value;e.bonus=Number($('fBonus').value)||0;e.cash=$('fCash').checked;e.store=$('fStore').value||'Official Store';e.head=$('fHead').value.trim();e.sub=$('fSub').value.trim();e.rw=$('fRw').value;e.rwName=$('fRwName').value.trim();$('fRwName').disabled=e.rw==='voucher';
  e.products.forEach(function(p,i){var el=$('pn'+i);if(el)p.name=el.value||p.name;});
  clubs.__preview=e;var keep=cur;cur='__preview';applyVars();$('club').innerHTML=R[step]();cur=keep;delete clubs.__preview;drawCrest();}
$('fCash').addEventListener('change',live);
['fName','fShort','fSeason','fBonus','fStore','fHead','fSub','fRwName'].forEach(function(id){$(id).addEventListener('input',live);});
$('prodList').addEventListener('input',live);
function bindColor(a,b,key){$(a).addEventListener('input',function(){$(b).value=this.value;editing[key]=this.value;live();drawProds();});
  $(b).addEventListener('input',function(){if(/^#[0-9a-f]{6}$/i.test(this.value)){$(a).value=this.value;editing[key]=this.value;live();drawProds();}});}
bindColor('fC1','fC1t','c1');bindColor('fC2','fC2t','c2');
function readImage(file){return new Promise(function(res,rej){if(!file)return rej();
  if(assets){assets.upload(file).then(function(r){res(r.id);},function(){toData(file).then(res,rej);});}else toData(file).then(res,rej);});}
function toData(file){return new Promise(function(res,rej){var im=new Image(),fr=new FileReader();fr.onload=function(){im.onload=function(){var m=600,s=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.85));};im.onerror=rej;im.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}
$('fCrest').addEventListener('change',function(){var f=this.files[0];$('msg').textContent='Subiendo escudo…';readImage(f).then(function(ref){editing.crest=ref;$('msg').textContent='Crest ready. Save to keep it.';live();},function(){$('msg').textContent='Could not read the image. Try a PNG or JPG.';});});
$('crestReset').onclick=function(){editing.crest=null;live();};
$('prodList').addEventListener('change',function(e){var i=e.target.dataset.pf;if(i==null)return;var f=e.target.files[0];$('msg').textContent='Subiendo foto…';
  readImage(f).then(function(ref){editing.products[i].photo=ref;drawProds();live();$('msg').textContent='Photo ready. Save to keep it.';},function(){$('msg').textContent='Could not read the image. Try a PNG or JPG.';});});
$('openSet').onclick=function(){fillForm();$('drawer').hidden=false;$('fName').focus();};
$('closeSet').onclick=function(){$('drawer').hidden=true;render();};
function persist(id,data){clubs[id]=data;saveLocal();
  if(db){var d=clone(data);delete d.id;d.updatedAt=Date.now();return db.doc('clubs/'+id).set(d).then(function(){return true;},function(){return false;});}
  return Promise.resolve(false);}
function saveLocal(){try{var o={};Object.keys(clubs).forEach(function(k){if(k!=='demo')o[k]=clubs[k];});localStorage.setItem('dl-demo-clubs',JSON.stringify(o));}catch(e){}}
function doSave(asNew,pre){if(!pre)live();var e=pre||clone(editing);var id=(asNew||cur==='demo')?(slug(e.short||e.name)+'-'+Math.random().toString(36).slice(2,6)):cur;e.id=id;
  persist(id,e).then(function(ok){cur=id;try{localStorage.setItem('dl-demo-cur',cur);}catch(x){}renderSel();fillForm();render();
    $('msg').textContent=db?(ok?'Saved. Anyone opening the demo will see it.':'Could not save to the server; saved in this browser.'):'Saved in this browser.';});}
$('fRw').addEventListener('change',function(){if(step===0)go(13);live();});
$('fCover').addEventListener('change',function(){var f=this.files[0];$('msg').textContent='Subiendo portada…';readImage(f).then(function(ref){editing.cover=ref;drawCover();if(step!==0)go(0);live();$('msg').textContent='Cover ready. Save to keep it.';},function(){$('msg').textContent='Could not read the image. Try a PNG or JPG.';});});
$('coverReset').onclick=function(){editing.cover=null;drawCover();live();};
$('dup').onclick=function(){live();var e=clone(editing);e.name=(e.name||'Club')+' (copia)';e.short=(e.short||e.name)+' (copia)';doSave(true,e);};
function expData(){var o={};Object.keys(clubs).forEach(function(k){if(k!=='demo'&&k!=='__preview')o[k]=clubs[k];});return JSON.stringify({app:'drelife-demo',version:1,exported:new Date().toISOString(),clubs:o},null,1);}
$('exp').onclick=function(){var txt=expData(),fn='drelife-demo-clubes.json';
  (window.claude&&window.claude.use?window.claude.use('downloads'):Promise.resolve(null)).then(function(dl){
    if(dl)return dl.save({filename:fn,data:txt}).then(function(){$('msg').textContent='Settings exportada.';},function(e){$('msg').textContent=(e&&e.code==='declined')?'Export cancelled.':'Could not download; the settings were copied to the clipboard.';copyTxt(txt);});
    copyTxt(txt);$('msg').textContent='Settings copied to the clipboard. Paste them into a .json file to keep them.';});};
function copyTxt(t){try{navigator.clipboard.writeText(t).catch(function(){});}catch(e){}}
$('imp').addEventListener('change',function(){var f=this.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){try{var o=JSON.parse(fr.result),cl=o.clubs||o,n=0;
    Object.keys(cl).forEach(function(k){var v=cl[k];if(!v||!v.name)return;if(!v.products||!v.products.length)v.products=clone(DEMO.products);v.id=k;persist(k,v);n++;});
    renderSel();$('msg').textContent=n?('Importados '+n+' clubes.'):'El archivo no contiene clubes.';}catch(e){$('msg').textContent='The file is not a valid configuration.';}};fr.readAsText(f);this.value='';});
$('save').onclick=function(){doSave(false);};$('saveNew').onclick=function(){doSave(true);};
var delArm=false;
$('del').onclick=function(){if(cur==='demo')return;if(!delArm){delArm=true;this.textContent='Click again to delete';setTimeout(function(){delArm=false;$('del').textContent='Delete club';},3000);return;}
  var id=cur;delete clubs[id];saveLocal();if(db)db.doc('clubs/'+id).delete().catch(function(){});cur='demo';delArm=false;$('del').textContent='Delete club';renderSel();fillForm();render();$('msg').textContent='Club eliminado.';};

/* ---------- boot ---------- */
if(false)try{var loc=JSON.parse(localStorage.getItem('dl-demo-clubs')||'{}');Object.keys(loc).forEach(function(k){clubs[k]=loc[k];});var lc=localStorage.getItem('dl-demo-cur');if(lc&&clubs[lc])cur=lc;}catch(e){}
renderSel();render();
if(false){
  window.claude.use('db').then(function(d){db=d;if(!db)return;
    db.collection('clubs').onSnapshot(function(snap){snap.docs.forEach(function(doc){var v=clone(doc.data()||{});v.id=doc.id;if(!v.products||!v.products.length)v.products=clone(DEMO.products);clubs[doc.id]=v;});
      snap.docChanges().forEach(function(ch){if(ch.type==='removed'){delete clubs[ch.doc.id];if(cur===ch.doc.id)cur='demo';}});
      saveLocal();renderSel();if($('drawer').hidden)render();},function(){});}).catch(function(){});
  window.claude.use('assets').then(function(a){assets=a;}).catch(function(){});
}
})();
</script>

</body>
</html>
